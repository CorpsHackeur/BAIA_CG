# Adresse des gemeinsamen KI-Servers (LM Studio). Gilt für alle Agenten der Lobby-Maschine.
#
# auto  = jeder Agent sucht LM Studio selbst: erst auf diesem Rechner, dann im WLAN.
#         Funktioniert in jedem WLAN ohne Änderung. Die gefundene Adresse wird in
#         .netz.json gemerkt, damit der nächste Start schnell geht.
#
# Feste Adresse statt auto, wenn die Suche nicht klappt (z. B. in Gäste-WLANs):
#         server: http://192.168.136.227:1234
#
# Ein einzelner Agent kann in seiner config.yaml mit "server:" eine andere Adresse setzen.

server: auto
